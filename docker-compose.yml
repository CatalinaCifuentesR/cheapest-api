services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cheapest}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cheapest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  logistica:
    build:
      context: .
      dockerfile: apps/logistica/Dockerfile
    restart: unless-stopped
    ports:
      - "${LOGISTICA_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      # El Postgres local no tiene SSL (en RDS sí se usa, valor por defecto true)
      DB_SSL: "false"
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-cheapest}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cheapest-network

  inventario:
    build:
      context: .
      dockerfile: apps/inventario/Dockerfile
    restart: unless-stopped
    ports:
      - "${INVENTARIO_PORT:-3002}:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      # El Postgres local no tiene SSL (en RDS sí se usa, valor por defecto true)
      DB_SSL: "false"
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-cheapest}
      LOGISTICA_BASE_URL: http://logistica:3001
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
      logistica:
        condition: service_started
    networks:
      - cheapest-network

  # Sidecar: Envoy proxy between ventas and inventario.
  # Implements retry with exponential backoff + jitter (Táctica 1)
  # and circuit breaker via outlier detection (Táctica 2)
  # without touching any NestJS application code.
  ventas-sidecar:
    build:
      context: apps/ventas/sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # docker-compose: resolve inventario by service name
      INVENTARIO_UPSTREAM_HOST: inventario
      INVENTARIO_UPSTREAM_PORT: 3002
    ports:
      - "${VENTAS_SIDECAR_ADMIN_PORT:-9901}:9901"  # Envoy admin — metrics & health
    depends_on:
      inventario:
        condition: service_started
    networks:
      - cheapest-network

  ventas:
    build:
      context: .
      dockerfile: apps/ventas/Dockerfile
    restart: unless-stopped
    ports:
      - "${VENTAS_PORT:-3003}:3003"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      # El Postgres local no tiene SSL (en RDS sí se usa, valor por defecto true)
      DB_SSL: "false"
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-cheapest}
      LOGISTICA_BASE_URL: http://logistica:3001
      PORT: 3003
      # Point ventas at the sidecar proxy, not directly at inventario.
      # The sidecar adds retry + circuit breaker transparently.
      # Lab 5, configuración sin sidecar (grupo de control):
      #   VENTAS_INVENTARIO_BASE_URL=http://inventario:3002 docker compose up -d ventas
      INVENTARIO_BASE_URL: ${VENTAS_INVENTARIO_BASE_URL:-http://ventas-sidecar:10000}
      # Timeout must be >= sidecar total timeout (8s) to avoid premature abort
      INVENTARIO_TIMEOUT_MS: 9000
      # Puerto de administración de Envoy: POST /ventas/chaos/sidecar llama a /quitquitquit
      SIDECAR_ADMIN_URL: http://ventas-sidecar:9901
      # Intentos del Outbox antes de marcar FAILED (polling de 2 s → 600 ≈ 20 min)
      OUTBOX_MAX_ATTEMPTS: 600
    depends_on:
      postgres:
        condition: service_healthy
      logistica:
        condition: service_started
      ventas-sidecar:
        condition: service_started
    networks:
      - cheapest-network

volumes:
  postgres_data:
    driver: local

networks:
  cheapest-network:
    driver: bridge
